jwt:
  secret: gateway-test-secret-long-enough-for-hs256

spring:
  # Spans are not exported in tests: there is no collector, and TracePropagationTest checks headers.
  zipkin:
    enabled: false
  cloud:
    gateway:
      httpclient:
        response-timeout: 500ms

# High enough that routing, circuit breaker and retry tests never hit the limiter;
# RateLimitTest overrides these with small values.
rate-limit:
  api:
    replenish-rate: 1000
    burst-capacity: 2000
  login:
    replenish-rate: 1000
    burst-capacity: 2000
    requested-tokens: 1

# Same behaviour as production, scaled down so a test opens and closes a circuit in about a second.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 4
        minimum-number-of-calls: 4
        wait-duration-in-open-state: 1s
        permitted-number-of-calls-in-half-open-state: 1
  timelimiter:
    configs:
      default:
        timeout-duration: 2s
