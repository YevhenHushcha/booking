# Scrapes the management port of each app (not published outside the compose network).
global:
  # Short for a demo so the dashboard reacts within seconds; 15-30s is usual in production.
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: coworking
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - gateway:9080
          - user-service:9081
          - workspace-service:9082
          - booking-service:9083
