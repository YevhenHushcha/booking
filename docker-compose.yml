name: coworking

x-service-base: &service-base
  environment: &service-env
    SPRING_PROFILES_ACTIVE: docker
    DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

x-healthcheck: &app-healthcheck
  test: ["CMD-SHELL", "wget -qO- http://localhost:$${SERVER_PORT}/actuator/health | grep -q '\"status\":\"UP\"'"]
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 40s

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      APP_DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Rate limiter buckets. No published port and no password: it is reachable only from the
  # compose network. Production would require AUTH and TLS.
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  gateway:
    <<: *service-base
    # The gateway has no database; it needs Redis only.
    depends_on:
      redis:
        condition: service_healthy
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MODULE: gateway
    environment:
      <<: *service-env
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    ports:
      - "8080:8080"
    healthcheck: *app-healthcheck

  # The three service ports are published for local debugging only.
  # In production the gateway would be the single public entry point.
  user-service:
    <<: *service-base
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MODULE: user-service
    environment:
      <<: *service-env
      SERVER_PORT: 8081
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    ports:
      - "8081:8081"
    healthcheck: *app-healthcheck

  workspace-service:
    <<: *service-base
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MODULE: workspace-service
    environment:
      <<: *service-env
      SERVER_PORT: 8082
    ports:
      - "8082:8082"
    healthcheck: *app-healthcheck

  booking-service:
    <<: *service-base
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MODULE: booking-service
    environment:
      <<: *service-env
      SERVER_PORT: 8083
    ports:
      - "8083:8083"
    healthcheck: *app-healthcheck

volumes:
  pgdata:
