server:
  port: 8081

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://localhost:5432/users_db
    username: users_app
    # No default on purpose: the app must not start with a password baked into the image.
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    # db/demo seeds the demo accounts; a production profile would list db/migration only.
    locations: classpath:db/migration,classpath:db/demo
  mvc:
    # Errors as RFC 9457 application/problem+json instead of Boot's whitelabel JSON.
    problemdetails:
      enabled: true

jwt:
  # No default: must be the same secret the gateway verifies with.
  secret: ${JWT_SECRET}
  ttl: 15m

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

---
# Active inside docker-compose, where Postgres answers to its service name.
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/users_db
