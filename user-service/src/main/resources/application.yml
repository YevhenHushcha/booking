server:
  port: 8081

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://localhost:5432/users_db
    username: users_app
    # No default on purpose: the app must not start with a password baked into the image.
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    # db/demo seeds the demo accounts; a production profile would list db/migration only.
    locations: classpath:db/migration,classpath:db/demo
  sleuth:
    sampler:
      # Every request is traced so any demo call can be found in Jaeger. Production samples a
      # fraction here, or keeps 100% and lets a collector tail-sample.
      probability: 1.0
    jdbc:
      # One span per SQL statement; the default also traces connection and result-set
      # handling, which triples the span count without saying anything new.
      includes: query
  zipkin:
    # Jaeger accepts the Zipkin v2 format on this port.
    base-url: http://localhost:9411/

jwt:
  # No default: must be the same secret the gateway verifies with.
  secret: ${JWT_SECRET}
  ttl: 15m

management:
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Buckets instead of client-side percentiles: p99 is computed in Prometheus and can be
      # aggregated across instances, which precomputed percentiles cannot.
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

---
# Active inside docker-compose, where Postgres answers to its service name.
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/users_db
  zipkin:
    base-url: http://jaeger:9411/
