# Log4j 1.x configuration. Boot's logging system is switched off (see common-observability's
# Log4jLoggingListener), so logging.level.* in application.yml has no effect: levels are set here.
log4j.rootLogger=INFO, console

log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.layout=org.apache.log4j.PatternLayout
# traceId and spanId are put in the MDC by Sleuth; empty outside a request.
log4j.appender.console.layout.ConversionPattern=%d{ISO8601} %-5p [user-service,%X{traceId},%X{spanId}] [%t] %c{1} - %m%n

# Hibernate and Hikari are chatty at INFO during startup.
log4j.logger.org.hibernate=WARN
log4j.logger.com.zaxxer.hikari=WARN
