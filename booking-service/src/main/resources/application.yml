server:
  port: 8083

spring:
  application:
    name: booking-service
  datasource:
    url: jdbc:postgresql://localhost:5432/bookings_db
    username: bookings_app
    # No default on purpose: the app must not start with a password baked into the image.
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  sleuth:
    sampler:
      # Every request is traced so any demo call can be found in Jaeger. Production samples a
      # fraction here, or keeps 100% and lets a collector tail-sample.
      probability: 1.0
    jdbc:
      # One span per SQL statement; the default also traces connection and result-set
      # handling, which triples the span count without saying anything new.
      includes: query
  zipkin:
    # Jaeger accepts the Zipkin v2 format on this port.
    base-url: http://localhost:9411/

services:
  workspace-service: http://localhost:8082

feign:
  client:
    config:
      default:
        # The workspace check runs inside a booking request; without a read timeout a hung
        # workspace-service would hold that request until the gateway gives up on it.
        connect-timeout: 1000
        read-timeout: 2000

management:
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Buckets instead of client-side percentiles: p99 is computed in Prometheus and can be
      # aggregated across instances, which precomputed percentiles cannot.
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

---
# Active inside docker-compose, where Postgres answers to its service name.
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/bookings_db
  zipkin:
    base-url: http://jaeger:9411/

services:
  workspace-service: http://workspace-service:8082
